<!DOCTYPE html>
<html>
<head>
    <title>Test Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Test Thanh Search</h1>
        
        <!-- Search and Filter Section -->
        <div class="search-filter-section d-flex align-items-center mx-3">
            <form action="" method="GET" class="d-flex align-items-center gap-2" style="min-width: 400px;">
                <!-- Search Input -->
                <div class="search-input-wrapper position-relative" style="flex: 1;">
                    <input type="text" 
                           name="search" 
                           class="form-control form-control-sm" 
                           placeholder="Tìm kiếm phim..." 
                           value=""
                           style="padding-left: 35px; border-radius: 20px; border: 1px solid #ddd;">
                    <i class="fa fa-search position-absolute" 
                       style="left: 12px; top: 50%; transform: translateY(-50%); color: #999; font-size: 14px;"></i>
                </div>

                <!-- Genre Filter -->
                <div class="filter-dropdown">
                    <select name="genre" class="form-select form-select-sm" style="border-radius: 20px; border: 1px solid #ddd; min-width: 120px;">
                        <option value="">Tất cả thể loại</option>
                        <option value="1">Superhero</option>
                        <option value="2">Action</option>
                        <option value="3">Hành động</option>
                    </select>
                </div>

                <!-- Search Button -->
                <button type="submit" class="btn btn-sm" style="background: linear-gradient(45deg, #ff6b6b, #ffa500); color: white; border: none; border-radius: 20px; padding: 6px 15px;">
                    <i class="fa fa-search"></i>
                </button>

                <!-- Clear Button -->
                <a href="" class="btn btn-sm btn-outline-secondary" style="border-radius: 20px; padding: 6px 12px;">
                    <i class="fa fa-times"></i>
                </a>
            </form>
        </div>
        
        <p class="mt-3">Thanh tìm kiếm đã được tạo thành công!</p>
    </div>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
